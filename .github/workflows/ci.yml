# Checks for every pull request, and the gate in front of every release (release.yml calls this).
# Database tests run against a real PostgreSQL 18 and must not skip: a suite that can't reach its
# database fails here instead of passing empty.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PGHOST: localhost
  PGUSER: postgres

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres: &postgres
        image: postgres:18-bookworm
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.33.2 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: .github/pg-client.sh
      - name: test databases
        run: createdb crema_test && pnpm demo:db
      - run: pnpm vitest run --reporter=default --reporter=json --outputFile=vitest.json
        env:
          CREMA_TEST_REQUIRE_DB: "1"
          CREMA_ENCRYPTION_KEY: ci-only-key
          CREMA_SAFETY_TEST_URL: postgresql://postgres@localhost:5432/postgres
          CREMA_TEST_HOSTING_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
          CREMA_TEST_ADMIN_URL: postgresql://postgres@localhost:5432/crema_demo
          CREMA_TEST_STATE_URL: postgresql://postgres@localhost:5432/crema_test
      - name: nothing skipped
        run: jq -e '.numPendingTests == 0 and .numTodoTests == 0' vitest.json

  # The UI the production way (next build + next start + worker), no model calls.
  ui:
    runs-on: ubuntu-24.04
    services:
      postgres: *postgres
    env:
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123
      CREMA_ENCRYPTION_KEY: ci-only-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.33.2 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: .github/pg-client.sh
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright, path: test-results/, retention-days: 7 }

  # A pull request also proves the image builds (release.yml builds and publishes on main).
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=amd64
