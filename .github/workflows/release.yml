# Every push to main: the ci.yml checks, then the image for amd64 and arm64 (each on its own native
# runner), published to ghcr.io/lf2foce/crema as :latest and :sha-<commit> with a signed build
# provenance, then the test deployment pulls it. A tag v1.2.3 publishes :1.2.3 and :1.2 without
# deploying. Self-hosters run the same image.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# one release per ref at a time; a newer push waits rather than cutting a deploy in half
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - id: arch
        run: echo "name=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env: { PLATFORM: "${{ matrix.platform }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with: { images: "${{ env.IMAGE }}", labels: "${{ env.LABELS }}" }
        env:
          LABELS: |
            org.opencontainers.image.title=Crema
            org.opencontainers.image.description=Business metrics your AI proposes and a person certifies, served over API and MCP
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          build-args: CREMA_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ steps.arch.outputs.name }}
          cache-to: type=gha,scope=${{ steps.arch.outputs.name }},mode=max
      - run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "digest-${{ steps.arch.outputs.name }}", path: /tmp/digests/*, retention-days: 1 }

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: /tmp/digests, pattern: digest-*, merge-multiple: true }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env: { DOCKER_METADATA_ANNOTATIONS_LEVELS: index }
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          annotations: |
            org.opencontainers.image.description=Business metrics your AI proposes and a person certifies, served over API and MCP
      - id: index
        name: one multi-platform image
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"
          first=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      # `gh attestation verify oci://ghcr.io/lf2foce/crema:latest -R lf2foce/crema` checks it came from this workflow
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: { name: test, url: "https://crema.phenau.com" }
    permissions: {}
    steps:
      # Dokploy's deploy hook for the test instance: it pulls :latest and restarts web and worker,
      # then this waits until the instance reports the commit it was asked to run.
      - env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$HOOK" ]; then echo "::notice::DOKPLOY_DEPLOY_HOOK not set: published, not deployed"; exit 0; fi
          jq -n --arg id "$GITHUB_SHA" --arg m "${MESSAGE%%$'\n'*}" '{ref: "refs/heads/main", commits: [], head_commit: {id: $id, message: $m}}' \
            | curl -fsS -X POST "$HOOK" -H 'content-type: application/json' -H 'x-github-event: push' --data @-
          echo
          for _ in $(seq 1 60); do
            v=$(curl -fsS https://crema.phenau.com/api/version 2>/dev/null || true)
            case "$v" in *"$GITHUB_SHA"*) echo "live: $v"; exit 0;; esac
            sleep 10
          done
          echo "::error::crema.phenau.com did not report $GITHUB_SHA within 10 minutes"; exit 1
