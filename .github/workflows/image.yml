# Builds one image for amd64 and arm64, each on its own native runner, and publishes it as a single
# multi-platform image with an SBOM, provenance and a signed attestation. Called by release.yml (the
# app) and postgres.yml (the database image).
name: image

on:
  workflow_call:
    inputs:
      name: { type: string, required: true }        # ghcr.io/<owner>/<name>
      context: { type: string, default: "." }
      title: { type: string, required: true }
      description: { type: string, required: true }
      tags: { type: string, required: true }        # docker/metadata-action tag rules
    outputs:
      digest: { value: "${{ jobs.publish.outputs.digest }}" }

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
    steps:
      - id: arch
        run: echo "name=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env: { PLATFORM: "${{ matrix.platform }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # the commit itself (Git context, so .dockerignore applies), or a directory of it
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}${{ inputs.context != '.' && format(':{0}', inputs.context) || '' }}
          platforms: ${{ matrix.platform }}
          build-args: CREMA_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ inputs.name }}-${{ steps.arch.outputs.name }}
          cache-to: type=gha,scope=${{ inputs.name }}-${{ steps.arch.outputs.name }},mode=max
      - run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "digest-${{ inputs.name }}-${{ steps.arch.outputs.name }}", path: /tmp/digests/*, retention-days: 1 }

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: /tmp/digests, pattern: "digest-${{ inputs.name }}-*", merge-multiple: true }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env: { DOCKER_METADATA_ANNOTATIONS_LEVELS: index }
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tags }}
          annotations: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
      - id: index
        name: one multi-platform image
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r t; do args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}"
          first=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      # `gh attestation verify oci://<image> -R lf2foce/crema` checks it came from this repository's workflows
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
