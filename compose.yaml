name: crema

x-app: &app
  # the published image (amd64 + arm64): :latest follows main, :sha-<commit> and :<version> are fixed.
  # `docker compose pull` fetches a newer one; `docker compose build` builds it from this checkout.
  image: ${CREMA_IMAGE:-ghcr.io/lf2foce/crema}:${CREMA_IMAGE_TAG:-latest}
  build: .
  init: true
  cpus: ${CREMA_APP_CPUS:-0.75}
  mem_limit: ${CREMA_APP_MEMORY:-512m}
  security_opt:
    - no-new-privileges:true
  environment: &environment
    NODE_ENV: production
    DATABASE_URL: postgresql://crema:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD}@postgres:5432/crema
    APP_URL: ${APP_URL:-http://localhost:3300}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    CREMA_SETUP_TOKEN: ${CREMA_SETUP_TOKEN:-}
    CREMA_ENCRYPTION_KEY: ${CREMA_ENCRYPTION_KEY:-}
    CREMA_API_TOKEN: ${CREMA_API_TOKEN:-}
    CREMA_PROVIDER: ${CREMA_PROVIDER:-google}
    CREMA_MODEL: ${CREMA_MODEL:-gemini-3.8-flash}
    CREMA_THINKING: ${CREMA_THINKING:-low}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    XAI_API_KEY: ${XAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    CREMA_DRIFT_CRON: ${CREMA_DRIFT_CRON:-0 * * * *}
    CREMA_CURRENCY: ${CREMA_CURRENCY:-VND}
    # optional: a sample database offered on the Connect page (see demo/)
    CREMA_DEMO_URL: ${CREMA_DEMO_URL:-}
    # the bundled hosting server, offered in Databases → Servers: Crema's limited login only
    CREMA_BUNDLED_SERVER_URL: postgresql://crema_provisioner:${HOSTING_PROVISIONER_PASSWORD:?Set a URL-safe HOSTING_PROVISIONER_PASSWORD}@hosting:5432/postgres?sslmode=no-verify
    CREMA_BUNDLED_SERVER_PUBLIC_HOST: ${CREMA_HOSTING_PUBLIC_HOST:-localhost:5433}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Backups (optional): with a bucket on S3-compatible storage (Cloudflare R2, S3, B2, MinIO), both
# Postgres servers archive every WAL segment there, encrypted, and `crema-backup` takes base backups:
# restore to any moment. Keep CREMA_BACKUP_PASSPHRASE somewhere other than this machine; without it
# the backups can't be read. See docs/deployment.md → Backups.
x-postgres: &postgres
  image: ${CREMA_POSTGRES_IMAGE:-ghcr.io/lf2foce/crema-postgres}:${CREMA_POSTGRES_TAG:-18}
  build: deploy/postgres
  restart: unless-stopped
  stop_grace_period: 60s # a clean shutdown, not crash recovery on the next start
x-backup: &backup
  PGBACKREST_REPO1_S3_ENDPOINT: ${CREMA_BACKUP_S3_ENDPOINT:-}
  PGBACKREST_REPO1_S3_BUCKET: ${CREMA_BACKUP_S3_BUCKET:-}
  PGBACKREST_REPO1_S3_KEY: ${CREMA_BACKUP_S3_KEY:-}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${CREMA_BACKUP_S3_SECRET:-}
  PGBACKREST_REPO1_CIPHER_PASS: ${CREMA_BACKUP_PASSPHRASE:-}

services:
  postgres:
    <<: *postgres
    cpus: ${CREMA_DB_CPUS:-0.5}
    mem_limit: ${CREMA_DB_MEMORY:-512m}
    shm_size: 128m
    environment:
      <<: *backup
      PGBACKREST_STANZA: state
      PGBACKREST_REPO1_PATH: ${CREMA_BACKUP_PATH:-/crema}/state
      POSTGRES_USER: crema
      POSTGRES_DB: crema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 uses PGDATA=/var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    # Deliberately no ports: only reachable on the Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crema -d crema"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Postgres for the apps' databases Crema creates (hosted databases). A separate server from
  # `postgres` (Crema's own state): own volume, own superuser, reachable from the internet over TLS.
  hosting:
    <<: *postgres
    cpus: ${CREMA_HOSTING_CPUS:-1}
    mem_limit: ${CREMA_HOSTING_MEMORY:-1g}
    shm_size: 256m
    environment:
      <<: *backup
      PGBACKREST_STANZA: hosting
      PGBACKREST_REPO1_PATH: ${CREMA_BACKUP_PATH:-/crema}/hosting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HOSTING_SUPERUSER_PASSWORD:?Set HOSTING_SUPERUSER_PASSWORD}
      CREMA_PROVISIONER_PASSWORD: ${HOSTING_PROVISIONER_PASSWORD:?Set HOSTING_PROVISIONER_PASSWORD}
    volumes:
      - hosting-data:/var/lib/postgresql
      - ./deploy/hosting/init.sh:/docker-entrypoint-initdb.d/10-crema.sh:ro
    # Apps connect here. Set CREMA_HOSTING_BIND=127.0.0.1 to keep it local.
    ports:
      - "${CREMA_HOSTING_BIND:-0.0.0.0}:${CREMA_HOSTING_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["node", "--import", "tsx", "bin/migrate.ts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    # explicit, so a platform that adds its proxy network (Dokploy, for a domain) keeps this one too
    networks: [default]
    # Set CREMA_HTTP_PORT empty (not unset) for a random host port, when a proxy on this network
    # serves it and a rollout runs two web containers side by side (docs/deployment.md).
    ports:
      - "127.0.0.1:${CREMA_HTTP_PORT-3300}:3300"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s # healthy within seconds of starting, so a rollout switches over quickly
      retries: 3
    stop_grace_period: 20s
    labels:
      # Behind Traefik (Dokploy): a request on a connection the retiring container just closed is
      # sent again to the new one instead of failing with a 502. Attach "crema-retry@docker" to the
      # route (Dokploy: domain → middlewares). Ignored without Traefik.
      - traefik.http.middlewares.crema-retry.retry.attempts=3
      - traefik.http.middlewares.crema-retry.retry.initialinterval=100ms

  worker:
    <<: *app
    command: ["node", "--import", "tsx", "bin/worker.ts"]
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  hosting-data:
